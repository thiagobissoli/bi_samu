<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmação de e-mail — Qualidade SAMU</title>
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/adminlte/css/adminlte.min.css') }}">
</head>
<body class="login-page bg-body-secondary">
<div class="login-box">
    <div class="login-logo">
        <img src="/logo" alt="" style="max-height: 60px;" class="d-block mx-auto mb-2"
             onerror="this.style.display='none'">
        <b>Qualidade SAMU</b>
    </div>
    <div class="card">
        <div class="card-body login-card-body text-center">
            {% if ok %}
            <p class="text-success fs-5"><i class="fa-solid fa-circle-check me-1"></i> E-mail confirmado com sucesso.</p>
            {% else %}
            <p class="text-danger fs-5"><i class="fa-solid fa-circle-xmark me-1"></i> Link inválido ou expirado.</p>
            {% endif %}
            <a href="/login" class="btn btn-primary">Ir para o login</a>
        </div>
    </div>
</div>
</body>
</html>
