{% extends "base.html" %}

{% block breadcrumb %}
<li class="breadcrumb-item"><a href="/notificacoes/">Notificações</a></li>
<li class="breadcrumb-item active">Enviar</li>
{% endblock %}

{% block content %}
<div class="row"><div class="col-md-7">
<div class="card">
    <div class="card-header"><h3 class="card-title">Enviar notificação</h3></div>
    <form method="post" action="/notificacoes/enviar">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Destinatário *</label>
                <select name="usuario_id" class="form-select" required>
                    {% for u in usuarios %}<option value="{{ u.id }}">{{ u.nome }} ({{ u.email }})</option>{% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Título *</label>
                <input type="text" name="titulo" class="form-control" required maxlength="255">
            </div>
            <div class="mb-3">
                <label class="form-label">Mensagem *</label>
                <textarea name="mensagem" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select name="tipo" class="form-select">
                    <option value="info">Informação</option>
                    <option value="success">Sucesso</option>
                    <option value="warning">Aviso</option>
                    <option value="danger">Erro</option>
                </select>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Enviar</button>
            <a href="/notificacoes/" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</div></div>
{% endblock %}
