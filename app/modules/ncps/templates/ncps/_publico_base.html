<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NCPS{% endblock %} — Qualidade SAMU</title>
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/adminlte/css/adminlte.min.css') }}">
</head>
<body class="bg-body-secondary">
<main class="container py-4" style="max-width: 860px">
    <div class="text-center mb-4">
        <img src="/logo" alt="" style="max-height: 60px" class="mb-2" onerror="this.style.display='none'">
        <h1 class="h4 mb-1">{% block heading %}{% endblock %}</h1>
        <p class="text-body-secondary mb-0">{% block subheading %}{% endblock %}</p>
    </div>
    {% block content %}{% endblock %}
    <p class="text-center small mt-4">
        <a href="/ncps/publico">Notificar evento</a> ·
        <a href="/ncps/acompanhar">Acompanhar notificação</a> ·
        <a href="/login">Acesso restrito</a>
    </p>
</main>
</body>
</html>
